name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest scripts/tests/ -v --cov=scripts --cov-report=term-missing

  ios-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme TOTKWalkthrough \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -only-testing:TOTKWalkthroughTests/QuestContentParserTests \
            -only-testing:TOTKWalkthroughTests/ContentStoreTests \
            -only-testing:TOTKWalkthroughTests/ProgressStoreTests \
            -only-testing:TOTKWalkthroughTests/MapStoreTests \
            | xcpretty

      - name: Run snapshot tests (record mode on first run)
        run: |
          xcodebuild test \
            -scheme TOTKWalkthrough \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -only-testing:TOTKWalkthroughTests/SnapshotTests \
            RECORD_SNAPSHOTS=YES \
            | xcpretty
        continue-on-error: true

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: app/Tests/__Snapshots__/
          if-no-files-found: warn
