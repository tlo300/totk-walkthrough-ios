name: Build IPA

on:
  workflow_dispatch:
    inputs:
      model_variant:
        description: "Model variant (unused currently, reserved for future)"
        required: false
        default: "1B"

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive
        run: |
          xcodebuild archive \
            -scheme TOTKWalkthrough \
            -destination 'generic/platform=iOS' \
            -archivePath build/TOTKWalkthrough.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (unsigned)
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/TOTKWalkthrough.xcarchive/Products/Applications/TOTKWalkthrough.app \
            build/ipa/Payload/TOTKWalkthrough.app
          cp -r app/Resources/Content \
            build/ipa/Payload/TOTKWalkthrough.app/Content
          cd build/ipa && zip -r TOTKWalkthrough.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOTKWalkthrough-unsigned
          path: build/ipa/TOTKWalkthrough.ipa
